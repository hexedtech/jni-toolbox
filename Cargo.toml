[workspace]
members = ["macro", "src/test"]

[package]
name = "jni-toolbox"
description = "tools to make writing JNI native functions less tiresome"
repository = "https://github.com/hexedtech/jni-toolbox"
authors = [
	"alemi <me@alemi.dev>",
	"zaaarf <me@zaaarf.foo>"
]
license = "GPL-3.0-only"
version = "0.2.2"
edition = "2021"

[dependencies]
jni-toolbox-macro = { version = "0.2.2", path = "macro" }
jni = "0.22"
uuid = { version = "1.10", optional = true }
thiserror = "2.0"

[features]
default = []
unsigned = []
uuid = ["dep:uuid"]
